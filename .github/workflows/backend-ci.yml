name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app_ci
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app_ci_test
      JWT_SECRET: ci-only-dummy-secret-not-used-anywhere-real
      LLM_API_KEY: ci-only-dummy-key
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE app_ci;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE app_ci_test;"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run test suite
        run: python -m unittest discover -s tests -v
